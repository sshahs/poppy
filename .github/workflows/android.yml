name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Create a release with this version (e.g. 0.1.0). Leave empty for a plain build."
        required: false
        default: ""

concurrency:
  # Releases (tags or manual runs) get their own group and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POPPY_KEYSTORE_BASE64: ${{ secrets.POPPY_KEYSTORE_BASE64 }}
      POPPY_KEYSTORE_PASSWORD: ${{ secrets.POPPY_KEYSTORE_PASSWORD }}
      POPPY_KEY_ALIAS: ${{ secrets.POPPY_KEY_ALIAS }}
      POPPY_KEY_PASSWORD: ${{ secrets.POPPY_KEY_PASSWORD }}
      # Set when a release is requested from the Actions tab instead of by pushing a tag.
      POPPY_RELEASE_TAG: ${{ inputs.release_version && format('v{0}', inputs.release_version) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Version
        run: ./scripts/ci-version.sh

      - name: Signing
        run: ./scripts/decode-keystore.sh

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble release APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: ./scripts/collect-apks.sh

      # Best-effort: tag builds publish to Releases instead, and a full artifact quota
      # must never fail the build.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') && env.POPPY_RELEASE_TAG == '' }}
        continue-on-error: true
        with:
          name: poppy-${{ env.POPPY_VERSION_NAME }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || env.POPPY_RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          # For manual releases this creates the tag on the commit that was built.
          tag_name: ${{ env.POPPY_RELEASE_TAG || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Poppy ${{ env.POPPY_VERSION_NAME }}
          prerelease: ${{ env.POPPY_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: dist/*
