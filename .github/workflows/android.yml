name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POPPY_KEYSTORE_BASE64: ${{ secrets.POPPY_KEYSTORE_BASE64 }}
      POPPY_KEYSTORE_PASSWORD: ${{ secrets.POPPY_KEYSTORE_PASSWORD }}
      POPPY_KEY_ALIAS: ${{ secrets.POPPY_KEY_ALIAS }}
      POPPY_KEY_PASSWORD: ${{ secrets.POPPY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Version
        run: ./scripts/ci-version.sh

      - name: Signing
        run: ./scripts/decode-keystore.sh

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble release APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: ./scripts/collect-apks.sh

      - uses: actions/upload-artifact@v4
        with:
          name: poppy-${{ env.POPPY_VERSION_NAME }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Poppy ${{ env.POPPY_VERSION_NAME }}
          prerelease: ${{ env.POPPY_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: dist/*
