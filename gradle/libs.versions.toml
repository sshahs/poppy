[versions]
agp = "9.4.1"
kotlin = "2.4.10"
coroutines = "1.11.0"
compose-bom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.10.0"
core = "1.17.0"
browser = "1.9.0"
profileinstaller = "1.4.1"
coil = "3.3.0"
matrix-sdk = "26.10.23"
jna = "5.18.1"
# Must match the rustls-platform-verifier-android crate the Matrix SDK was built with
# (rustls-platform-verifier 0.7.x -> 0.2.0). Re-check when bumping matrix-sdk.
rustls-platform-verifier = "0.2.0"
unifiedpush = "3.3.5"
junit = "4.13.2"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
matrix-sdk = { module = "org.matrix.rustcomponents:sdk-android", version.ref = "matrix-sdk" }
rustls-platform-verifier = { module = "org.rustls:rustls-platform-verifier", version.ref = "rustls-platform-verifier" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }
unifiedpush = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
